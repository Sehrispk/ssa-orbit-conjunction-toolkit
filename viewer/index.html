<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Satellite trajectories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #controls {
            position: absolute; top: 12px; left: 12px; z-index: 1;
            max-width: calc(100vw - 48px); padding: 12px;
            color: white; background: #20252de8; font: 14px sans-serif;
        }
        #controls label { display: block; margin-bottom: 8px; }
        #controls input { display: block; box-sizing: border-box; width: 100%; }
        #status { max-width: 340px; margin-bottom: 0; }
    </style>
</head>

<body>
<div id="cesiumContainer"></div>
<form id="controls">
    <label>Satellite names (separate with commas)
        <input id="objects" value="ISS (ZARYA)" required>
    </label>
    <label>Start (local time)<input id="start" type="datetime-local" required></label>
    <label>End (local time)<input id="end" type="datetime-local" required></label>
    <button id="load" type="submit">Load trajectories</button>
    <p id="status" role="status">Choose satellites and a time range, then load.</p>
</form>

<script src="/viewer/viewer.js"></script>

</body>
</html>
