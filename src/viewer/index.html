<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
<div id="cesiumContainer"></div>

<script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
        shouldAnimate: true
    });

    Cesium.CzmlDataSource.load("conjunction.czml")
        .then(dataSource => {
            viewer.dataSources.add(dataSource);
            viewer.zoomTo(dataSource);
        });
    viewer.dataSources.add(
    Cesium.CzmlDataSource.load("conjunction.czml")
        );
</script>

</body>
</html>
